name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle Setup Action provides automatic caching for:
      # - Gradle User Home (wrapper distributions, remote dependencies, jars)
      # - Project Configuration Cache and Build Cache for fast repeat builds
      - name: Setup Gradle with Advanced Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          generate-job-summary: true
          gradle-home-cache-cleanup: true

      - name: Prepare build environment and keys
        run: |
          # Ensure gradlew has executable permission
          chmod +x gradlew

          # Prepare .env from .env.example if missing
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # Decode debug.keystore if base64 file exists
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Locate and identify generated APK
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in app/build/outputs/apk/"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk-path.outputs.apk_name }}
          path: ${{ steps.apk-path.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
